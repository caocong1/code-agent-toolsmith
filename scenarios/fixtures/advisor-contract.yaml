schema: advisor-contract-fixtures.v1

template_skeletons:
  standard: &standard_skeleton
    include_sections:
      - "0. 概况 / Situation (as understood)"
      - "1. 推荐组合 / Recommended stack"
      - "2. 上手步骤 / How to set up & use"
      - "3. 注意事项与风险 / Caveats & risks"
      - "4. Token / 成本 / Token & cost notes"
      - "5. 维护姿态 / Maintenance posture"
      - "6. 备选方案 / Fallbacks"
      - "7. 下一步 / Next steps"
    omit_sections: []
    footer: "Generated by **code-agent-toolsmith** skill `v<X.Y.Z>`, registry snapshot `v<...>`."
  quick_oneoff: &quick_oneoff_skeleton
    include_sections:
      - "0. 概况 / Situation (as understood)"
      - "1. 推荐组合 / Recommended stack"
      - "2. 上手步骤 / How to set up & use"
      - "3. 注意事项与风险 / Caveats & risks"
      - "4. Token / 成本 / Token & cost notes"
      - "6. 备选方案 / Fallbacks"
      - "7. 下一步 / Next steps"
    omit_sections:
      - "5. 维护姿态 / Maintenance posture"
    footer: "Generated by **code-agent-toolsmith** skill `v<X.Y.Z>`, registry snapshot `v<...>`."

fixtures:
  - id: new-project-team-maintainability
    scenario: new-project
    user_request: >-
      We are starting a brand-new, long-lived product with a small team. We
      want the AI coding setup to optimize for maintainability and collaboration
      from day one, with human review before major changes.
    repo_state:
      project_age: new
      ai_tooling: none
      scope: long_lived
      team: team
      primary_goal: maintainability
      risk_tolerance: human_in_loop
      multi_model: unknown
      tests: planned
      pain: []
    expected:
      starting_stack: Spec-first
      recommended_layers:
        - base-standard
        - spec
      active_tools_by_layer:
        base-standard:
          - agents-md
        spec:
          - spec-kit
      forbidden_layers_by_default:
        - skill
        - orchestration
      required_controls:
        - drift-control
        - test-ci-gate
      expected_skeleton: *standard_skeleton

  - id: brownfield-adopt-low-cost
    scenario: brownfield-adopt
    user_request: >-
      We have an existing service with little or no AI tooling. We want to
      introduce AI coding help at low cost, keep the process easy for the team,
      and avoid a big migration.
    repo_state:
      project_age: existing
      ai_tooling: none
      scope: ongoing
      team: team
      primary_goal: low_cost_maintainability
      risk_tolerance: human_in_loop
      multi_model: single_or_unknown
      tests: partial
      pain: []
    expected:
      starting_stack: Spec-light
      recommended_layers:
        - base-standard
        - spec
      active_tools_by_layer:
        base-standard:
          - agents-md
        spec:
          - openspec
      forbidden_layers_by_default:
        - skill
        - orchestration
      required_controls:
        - drift-control
        - one-slice-first
      expected_skeleton: *standard_skeleton

  - id: brownfield-optimize-token-conflict-drift
    scenario: brownfield-optimize
    user_request: >-
      We already have an AI setup with hooks, skills, and a spec folder, but it
      burns too many tokens, tools conflict with each other, and specs drift away
      from code. Recommend the smallest cleanup or replacement path.
    repo_state:
      project_age: existing
      ai_tooling: heavy
      satisfaction: unhappy
      scope: ongoing
      team: team
      primary_goal: reduce_token_burn_and_drift
      risk_tolerance: human_in_loop
      multi_model: mixed
      tests: partial
      pain:
        - token_burn
        - tool_conflicts
        - spec_drift
    expected:
      starting_stack: Remove-before-add baseline
      recommended_layers:
        - base-standard
        - spec
      active_tools_by_layer:
        base-standard:
          - agents-md
        spec:
          - openspec
      forbidden_layers_by_default:
        - skill
        - orchestration
      required_controls:
        - retire-before-add
        - drift-control
        - rollback-path
      expected_skeleton: *standard_skeleton

  - id: quick-oneoff-throwaway
    scenario: quick-oneoff
    user_request: >-
      This is a quick throwaway one-off script. I just need the agent to make the
      change today; do not set up a methodology or long-term workflow.
    repo_state:
      project_age: existing
      ai_tooling: light
      scope: one_off
      team: unknown
      primary_goal: finish_quickly
      risk_tolerance: human_in_loop
      multi_model: irrelevant
      tests: irrelevant
      pain: []
    expected:
      starting_stack: Minimal or none
      recommended_layers: []
      active_tools_by_layer: {}
      forbidden_layers_by_default:
        - spec
        - skill
        - orchestration
        - ide-platform
        - directory
      required_controls: []
      expected_skeleton: *quick_oneoff_skeleton
