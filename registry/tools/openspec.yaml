notes: >-
  Brownfield-first; highest bang-for-buck spec layer. Main risk is spec drift —
  specs must be kept in sync with code or they mislead the AI. MIT; pure
  specs-in-repo (no MCP / API keys / external services).

profile:
  problem_solved: "AI agents lose intent across sessions and vibe-code; a durable in-repo spec keeps humans and agents aligned before code."
  strengths:
    - "Pure specs-in-repo: no API keys, MCP, or external services"
    - "Lightweight and brownfield-friendly — adopt incrementally on one slice"
    - "Tool-agnostic spec format works across 20+ agents"
  weaknesses:
    - "Requires upfront spec-authoring discipline"
    - "Spec drift if specs aren't reviewed on each change"
