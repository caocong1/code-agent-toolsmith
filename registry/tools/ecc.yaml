    - omc
  best_fit: "Claude Code or cross-harness user who wants one large, opinionated agent/skill/hook/rule surface and is willing to audit and own that surface."
  anti_fit: "Small tasks, minimal-context workflows, or teams that need a lightweight methodology pack instead of a broad harness operating layer."
